[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kubeguard"
version = "0.1.0"
description = "A production-grade health check cli for kubernetes"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Toufeeq Sharieff", email = "toufeeqsharieff0@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [] 